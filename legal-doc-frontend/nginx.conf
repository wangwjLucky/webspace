# 前端容器 nginx 配置：托管 SPA 静态资源 + 反代 /api 到后端容器
# 后端地址：docker compose 下服务名 api；独立部署改用实际后端地址（可通过环境变量替换）

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback：所有非文件路径回 index.html（Vue router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + 预览反代到后端（compose 服务名 api）
    location /api/ {
        proxy_pass http://api:9898;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文件上传与 OCR 流式：放宽超时与请求体
        client_max_body_size 512m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
